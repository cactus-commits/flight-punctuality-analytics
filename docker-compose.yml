services:
  dwh_pipeline:
    platform: linux/amd64
    build:
      context: .
      dockerfile: dockerfile.dwh
    ports:
      - "3000:3000"
    env_file:
      - .env
    ##add
    image: ${ACR_LOGIN_SERVER}/dwh_pipeline:latest

  dashboard:
    platform: linux/amd64
    build:
      context: .
      dockerfile: dockerfile.dashboard
    ports:
      - "8501:8501"
    env_file:
      - .env
    image: ${ACR_LOGIN_SERVER}/dashboard:latest

