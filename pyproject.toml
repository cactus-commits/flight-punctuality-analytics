[project]
name = "flight-punctuality-analytics"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dagster>=1.13.25",
    "dagster-dbt>=0.29.25",
    "dagster-dg-cli>=1.13.25",
    "dagster-dlt>=0.29.25",
    "dagster-webserver>=1.13.25",
    "dbt-core>=1.12.5",
    "dbt-snowflake>=1.12.1",
    "dlt[duckdb,parquet,snowflake]>=1.31.0",
    "ipykernel>=7.4.0",
    "lxml>=6.1.3",
    "pandas>=3.0.6",
    "streamlit>=1.65.0",
]

# --- For Dagster ---
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Tell the build tool which folders are Python packages.
# The last part of each path becomes the import name.
packages = [
    "data_load_extract",
    "orchestration/src/orchestration",
]
# Kept from the scaffold. Delete it if the build complains about the file.
force-include = { "pyproject.toml" = "pyproject.toml" }

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "orchestration"
code_location_name = "orchestration.definitions"
registry_modules = [
    "orchestration.components.*",
]
